name: CPU verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: Test with branch coverage
        run: python -m coverage run -m pytest -q
      - run: python -m coverage report -m
      - run: python -m coverage json -o coverage.json
      - name: Enforce production coverage
        run: python tools/check_quality.py coverage.json
      - run: python -m ruff check .
      - name: Enforce complexity budget
        run: python -m ruff check src --select C901,PLR0911,PLR0912,PLR0915
      - name: Static security scan
        run: python -m bandit -r src -q
      - name: Dead-code scan
        run: python -m vulture src --min-confidence 80
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m build
      - run: python tools/check_release.py
      - run: python tools/wheel_smoke.py
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install "pip-audit>=2.9,<3"
      - name: Audit resolved runtime dependencies
        shell: bash
        run: |
          python -c 'import pathlib,tomllib; p=tomllib.loads(pathlib.Path("pyproject.toml").read_text()); pathlib.Path("/tmp/ra-audit-requirements.txt").write_text("\n".join(p["project"]["dependencies"])+"\n")'
          python -m pip_audit --strict --progress-spinner off -r /tmp/ra-audit-requirements.txt
